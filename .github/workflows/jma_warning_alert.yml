name: JMA warning alert (Nara basin)

on:
  workflow_dispatch: {}

concurrency:
  group: jma-warning-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check JMA warnings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python jma_warning_alert.py
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git pull --rebase && git push)
